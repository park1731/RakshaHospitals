<h2>Five pillars</h2>
<ul><li>Don’t smoke; limit alcohol</li>
<li>30–45 min activity most days</li>
<li>Eat more plants, fiber, and healthy fats</li>
<li>Sleep 7–8 hours</li>
<li>Manage stress</li>
</ul>
<h2>Screening</h2>
<p>Check BP, sugar, and lipids at recommended intervals — especially if you have family history or are over 40.</p>
